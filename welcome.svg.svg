<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <style>
    .bg { fill: #111111; rx: 12px; }
    .red { fill: #ff5f56; }
    .yellow { fill: #ffbd2e; }
    .green { fill: #27c93f; }
    .header-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #888888; font-size: 14px; }
    .code-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #00f0ff; font-size: 16px; filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.6)); }
    .pixel-text { font-family: monospace; font-weight: bold; fill: #00f0ff; font-size: 55px; letter-spacing: 4px; filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7)); }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; fill: #00bfff; font-size: 15px; }
  </style>

  <!-- Background Terminal -->
  <rect width="800" height="350" class="bg" />

  <!-- Tombol Terminal -->
  <circle cx="30" cy="25" r="6" class="red" />
  <circle cx="50" cy="25" r="6" class="yellow" />
  <circle cx="70" cy="25" r="6" class="green" />
  
  <!-- Teks Title Bar -->
  <text x="380" y="30" text-anchor="middle" class="header-text">nasfragile – zsh</text>

  <!-- Baris Perintah Terminal -->
  <text x="40" y="80" class="code-text">$ ./welcome.sh</text>

  <!-- Teks Tulisan WELCOME Biru Neon -->
  <text x="40" y="190" class="pixel-text">W E L C O M E</text>

  <!-- Sub-teks Bawah -->
  <text x="40" y="270" class="sub-text">welcome to my account – let's build</text>
</svg>
